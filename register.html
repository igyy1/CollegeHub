
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegeHub | Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo">C<span>.</span></div>
                <h1>CollegeHub<span>.</span></h1>
                <p>Your student workspace.</p>
            </div>

            <div class="auth-heading">
                <h2>Create your account</h2>
                <p>Get started with your CollegeHub workspace.</p>
            </div>

            <form id="registerForm">

                <div class="auth-field">
                    <label for="displayName">Display name</label>
                    <input
                        type="text"
                        id="displayName"
                        placeholder="Choose your username"
                        required
                        maxlength="30"
                    >
                </div>

                <div class="auth-field">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                        minlength="8"
                    >
                </div>

                
<label class="agreement-label">
    <input type="checkbox" id="termsAgreement" required>
    <span>
        I agree to the
        <a href="terms.html" target="_blank">Terms of Use</a>,
        <a href="acceptable-use.html" target="_blank">Acceptable Use Policy</a>
        and
        <a href="privacy.html" target="_blank">Privacy Policy</a>.
    </span>
</label>

                <button type="submit" class="auth-submit">
                    Create account
                </button>

            </form>

            <div class="auth-divider"></div>

            <div class="auth-register">
                <p>Already have an account?</p>
                <a href="login.html">Sign in</a>
            </div>

        </section>

        <footer class="site-footer auth-footer">

            <span>© 2026 CollegeHub. Personal project.</span>

            <div class="footer-links">
                <a href="about.html">About Us</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Use</a>
                <a href="acceptable-use.html">Acceptable Use</a>
            </div>

        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>

</body>
</html>
